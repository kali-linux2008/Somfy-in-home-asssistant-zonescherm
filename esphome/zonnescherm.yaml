esphome:
  name: zonnescherm
  friendly_name: zonnescherm

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot (captive portal) als de wifi-verbinding faalt
  ap:
    ssid: "Zonnescherm Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# === Somfy RTS via CC1101 ===

# Somfy RTS external component (officiele ESPHome CC1101 + remote_transmitter)
external_components:
  - source: github://HarmEllis/esphome-somfy-cover-remote@main
    components: [ somfy_rts ]

# --- CC1101 bedrading (zie ../docs/bedrading.md) ---
# CC1101  ->  ESP32
#   SCK   ->  GPIO18   (spi clk_pin)
#   MOSI  ->  GPIO23   (spi mosi_pin)
#   MISO  ->  GPIO19   (spi miso_pin)  [op de module mogelijk gelabeld SO of GDO1]
#   CSN   ->  GPIO5    (cc1101 cs_pin)
#   GDO0  ->  GPIO2    (remote_transmitter pin = OOK datalijn)
#   VCC   ->  3V3      GND -> GND
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: cc1101_radio
  cs_pin: GPIO5
  frequency: 433.42MHz       # Somfy RTS = 433,42 MHz, NIET 433,92
  modulation_type: ASK/OOK

remote_transmitter:
  id: transmitter
  pin: GPIO2                 # verbonden met CC1101 GDO0
  carrier_duty_percent: 100%

somfy_rts:
  - id: zonnescherm_cmd
    remote_transmitter: transmitter
    remote_code: 0x100001    # uniek 3-byte adres voor deze virtuele afstandsbediening
    storage_key: "zonnescherm"
    storage_namespace: "somfy_rts"
    repeat_command_count: 4

cover:
  - platform: time_based
    name: "Zonnescherm"
    device_class: awning
    # Meet de werkelijke tijden volledig in -> volledig uit en pas aan:
    open_duration: 18s
    close_duration: 17s
    open_action:
      - somfy_rts.open: zonnescherm_cmd
    close_action:
      - somfy_rts.close: zonnescherm_cmd
    stop_action:
      - somfy_rts.stop: zonnescherm_cmd

# Knop om de ESP32 in de motor in te leren (PROG)
button:
  - platform: template
    name: "Zonnescherm PROG (inleren)"
    entity_category: config
    on_press:
      - somfy_rts.program: zonnescherm_cmd
